<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>memebro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/step-indicator.css" />
    <link rel="stylesheet" href="./styles/home.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <script src="./scripts/header.js"></script>
    <main class="container">
      <section class="home-hero">
        <h1 class="home-hero__title">Put yourself in a meme.</h1>
        <p class="home-hero__subtitle">Upload a photo · Pick a template · Edit · Download</p>
      </section>
      <div class="home-cards">
        <div class="home-card">
          <div class="home-card__icon">
            <img src="./assets/icons/upload-cloud.svg" alt="" aria-hidden="true" />
          </div>
          <p class="home-card__title">Upload a photo</p>
          <p class="home-card__subtitle">JPG · PNG</p>
          <div class="home-card__actions">
            <a href="./pages/upload.html" class="btn btn--surface">Choose a file</a>
          </div>
        </div>
        <div class="home-card">
          <div class="home-card__icon">
            <img src="./assets/icons/grid.svg" alt="" aria-hidden="true" />
          </div>
          <p class="home-card__title">Browse Templates</p>
          <p class="home-card__subtitle">Or get a random one</p>
          <div class="home-card__actions">
            <a href="./pages/templates.html" class="btn btn--surface">Browse</a>
            <a href="./pages/templates.html" class="btn btn--surface">Random</a>
          </div>
        </div>
      </div>
    </main>
    <script type="module">
      // Returning home starts a brand-new process: clear any in-flight flow state.
      import { resetFlow } from "./lib/flow-dom.js";
      resetFlow();
    </script>
  </body>
</html>
