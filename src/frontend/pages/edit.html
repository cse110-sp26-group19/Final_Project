<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit — memebro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/step-indicator.css" />
    <link rel="stylesheet" href="../styles/edit.css" />
    <link rel="preload" href="../assets/loading.json" as="fetch" crossorigin />
    <script src="../assets/lottie.min.js"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <script src="../scripts/header.js"></script>

    <main class="container">
      <div class="edit-layout">
        <section class="edit-preview" aria-label="Meme preview">
          <p class="edit-preview__label">Preview</p>
          <div class="edit-preview__frame" id="preview-frame">
            <canvas class="edit-preview__canvas" id="preview-canvas"></canvas>
            <div class="edit-preview__status" id="preview-status">
              <div id="lottie-loading" style="width: 120px; height: 120px"></div>
              <span id="preview-status-text">Loading template…</span>
            </div>
            <script>
              lottie.loadAnimation({
                container: document.getElementById("lottie-loading"),
                renderer: "svg",
                loop: true,
                autoplay: true,
                path: "../assets/loading.json",
              });
            </script>
          </div>
          <p class="edit-preview__hint">Tip: drag any text on the preview to move it.</p>
        </section>

        <aside class="edit-panel" aria-label="Text editor">
          <div class="step-indicator">
            <span class="step-indicator__meta">Step 3 of 3 · Edit</span>
            <h1 class="step-indicator__title">Edit text</h1>
          </div>

          <div class="edit-inputs" id="edit-inputs"></div>

          <div class="edit-actions">
            <a href="templates.html" class="btn btn--surface">← Change template</a>
            <button class="btn" id="generate-btn" type="button" disabled aria-disabled="true">
              Generate →
            </button>
          </div>
          <div id="swap-status" class="edit-swap-status" hidden>
            <div id="lottie-swap" style="width:80px;height:80px;"></div>
            <span id="swap-status-text"></span>
            <div class="swap-progress" id="swap-progress" hidden>
              <div class="swap-progress__fill" id="swap-progress-fill"></div>
            </div>
          </div>
          <script>
            lottie.loadAnimation({
              container: document.getElementById('lottie-swap'),
              renderer: 'svg',
              loop: true,
              autoplay: true,
              path: '../assets/loading.json'
            });
          </script>
        </aside>
      </div>
    </main>

    <script type="module" src="../scripts/edit.js"></script>
  </body>
</html>
