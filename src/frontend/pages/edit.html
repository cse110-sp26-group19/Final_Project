<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit — memebro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/step-indicator.css" />
    <link rel="stylesheet" href="../styles/edit.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <script src="../scripts/header.js"></script>

    <main class="container">
      <div class="edit-layout">
        <section class="edit-preview" aria-label="Meme preview">
          <p class="edit-preview__label">Preview</p>
          <div class="edit-preview__frame" id="preview-frame">
            <canvas class="edit-preview__canvas" id="preview-canvas"></canvas>
            <div class="edit-preview__status" id="preview-status">
            <lottie-player
              src="../assets/loading.json"
              background="transparent"
              speed="1"
              style="width: 120px; height: 120px;"
              loop autoplay>
            </lottie-player>
            Loading template…
          </div>
          </div>
          <p class="edit-preview__hint">Tip: drag any text on the preview to move it.</p>
        </section>

        <aside class="edit-panel" aria-label="Text editor">
          <div class="step-indicator">
            <span class="step-indicator__meta">Step 3 of 3 · Edit</span>
            <h1 class="step-indicator__title">Edit text</h1>
          </div>

          <div class="edit-inputs" id="edit-inputs"></div>

          <div class="edit-actions">
            <a href="templates.html" class="btn btn--surface">← Change template</a>
            <button class="btn" id="generate-btn" type="button" disabled aria-disabled="true">
              Generate →
            </button>
          </div>
        </aside>
      </div>
    </main>

    <script type="module" src="../scripts/edit.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  </body>
</html>
