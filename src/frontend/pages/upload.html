<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload — memebro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/step-indicator.css" />
    <link rel="stylesheet" href="../styles/upload.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <script src="../scripts/header.js"></script>
    <main class="container">
      <div class="step-indicator">
        <span class="step-indicator__meta">Step 1 of 3 · Upload</span>
        <h1 class="step-indicator__title">Upload a photo</h1>
      </div>
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png" hidden />
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden />
      <div class="upload-zone" id="upload-zone">
        <img class="upload-zone__preview" id="upload-preview" alt="Uploaded photo preview" />
        <div class="upload-zone__content">
          <img class="upload-zone__icon" src="../assets/icons/upload-plus.svg" alt="" />
          <p class="upload-zone__text upload-zone__text--desktop">Drop a photo<br />or</p>
          <p class="upload-zone__text upload-zone__text--mobile">Tap to upload<br />JPG · PNG</p>
          <button
            class="upload-zone__btn upload-zone__btn--desktop"
            id="choose-file-btn"
            type="button"
          >
            Choose file
          </button>
        </div>
      </div>
      <div class="upload-mobile-btns">
        <button class="btn btn--surface upload-mobile-btns__btn" id="camera-btn" type="button">
          📷 Camera
        </button>
        <button class="btn btn--surface upload-mobile-btns__btn" id="library-btn" type="button">
          🖼 Library
        </button>
      </div>
      <div class="page-nav">
        <a href="../index.html" class="btn">← Back</a>
        <a href="templates.html" class="btn" id="next-btn" disabled aria-disabled="true"
          >Next: pick a meme →</a
        >
      </div>
    </main>
    <script type="module" src="../scripts/upload.js"></script>
  </body>
</html>
