<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your meme — memebro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/result.css" />
    <link rel="preload" href="../assets/loading.json" as="fetch" crossorigin />
    <script src="../assets/lottie.min.js"></script>
  </head>
  <body>
    <div id="site-header"></div>
    <script src="../scripts/header.js"></script>

    <main class="container">
      <h1 class="result-title">Your meme</h1>

      <div class="result-frame" id="result-frame">
        <!-- shown when the backend face-swap succeeds -->
        <img
          class="result-canvas result-swapped"
          id="result-swapped"
          alt="Face-swapped meme"
          hidden
        />
        <!-- fallback: text-only meme rendered locally -->
        <canvas class="result-canvas" id="result-canvas"></canvas>
        <div class="result-status" id="result-status">
          <div id="lottie-loading" style="width: 120px; height: 120px"></div>
          <span id="result-status-text">Loading meme…</span>
        </div>
        <script>
          lottie.loadAnimation({
            container: document.getElementById("lottie-loading"),
            renderer: "svg",
            loop: true,
            autoplay: true,
            path: "../assets/loading.json",
          });
        </script>
      </div>

      <div class="result-actions">
        <button class="btn" id="download-btn" type="button" disabled aria-disabled="true">
          ↓ Download
        </button>
        <button class="btn btn--surface" id="share-btn" type="button" disabled aria-disabled="true">
          🔗 Share link
        </button>
        <a class="btn btn--surface" id="restart-btn" href="../index.html">+ Make another</a>
      </div>

      <p class="result-toast" id="result-toast" role="status" aria-live="polite" hidden></p>
    </main>

    <script type="module" src="../scripts/result.js"></script>
  </body>
</html>
